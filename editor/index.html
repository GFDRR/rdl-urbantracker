---
<!doctype html>
<html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <link href="decap-cms.yml" type="text/yaml" rel="cms-config-url">
  </head>

  <body>
    <script>
      (function () {
        var hash = window.location.hash || '';
        var editorPath = '{{ site.baseurl }}/editor/';
        if (/(^|[#&])(confirmation_token|access_token)=/.test(hash)) {
          if (window.location.pathname !== editorPath) {
            window.location.replace(editorPath + hash);
          }
        }
      })();
    </script> 
    <script type="text/javascript">window.CMS_MANUAL_INIT = true</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="text/javascript">
      const { CMS, initCMS: init } = window
      
      let user_email;
      netlifyIdentity.on('login', user => {
        user_email = user?.email;
        netlifyIdentity.close();
      });

      const config = {
        local_backend: {% if jekyll.environment == "production" %}false{% else %}true{% endif %},
        site_url: "{{ site.url }}"
      }

      init({ config });

      const CityPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var logoUrl = entry.getIn(['data', 'flag']);

          return h('div', { style: { padding: '20px' } },
            h('h1', {}, entry.getIn(['data', 'city'])),
            h('ul', {},
              h('li', {}, h('strong', {}, 'Title: '), entry.getIn(['data', 'title'])),
              h('li', {}, h('strong', {}, 'Wikidata ID: '), entry.getIn(['data', 'city_id'])),
              h('li', {}, h('strong', {}, 'Country: '), entry.getIn(['data', 'country'])),
                        h('div', { style: { marginBottom: '20px' } },
              h('li', {}, h('strong', {}, 'Flag Preview:')),
              logoUrl 
                ? h('img', { src: logoUrl, style: { display: 'block', maxWidth: '200px', marginTop: '10px' } })
                : h('p', { style: { color: '#666' } }, 'No flag URL provided.')
              ),
              h('li', {}, h('strong', {}, 'Flag Credit: '), entry.getIn(['data', 'flag_attribution']))
            )
          );
        }
      });

      const SubmitterEmailControl = createClass({
        componentDidMount() {
          this.props.onChange(this.props.value ?? user_email)
        },

        handleChange(e) {
          this.props.onChange(e.target.value);
        },

        render: function() {          
          return h('input', {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            type: 'email',
            value: this.props.value,
            onChange: this.handleChange
          });
        }
      });

      const DatasetPreview = createClass({
        render: function() {
          const { entry, fieldsMetaData } = this.props;
          const cities = Object.values(fieldsMetaData.getIn(['cities'])?.toJS()?.cities ?? {}) ??[];
          const datatypes = Object.values(fieldsMetaData.getIn(['datatypes'])?.toJS()?.datatypes ?? {}) ??[];
          const external_url = entry.getIn(['data', 'external_url']);
          return h('div', { style: { padding: '20px' } },
            h('h1', {}, entry.getIn(['data', 'title'])),
            h('p', {}, entry.getIn(['data', 'description'])),
            cities.length ? h('p', {}, 'Cities: ') : '',
            h('ul', {}, 
              cities.map(function(c) {
                return h('li', {}, c.title + ' (' + c.city_id + ')')
              }),
            ),
            datatypes.length ? h('p', {}, 'Datatypes: ') : '',
            h('ul', {}, 
              datatypes.map(function(dt) {
                return h('li', {}, dt.category + ' / ' + dt.title, h('ul', {}, h('li', {}, dt.description + ', e.g. ' + dt.example_indicators)))
              }),
            ),
            external_url
              ? h('a', { href: entry.getIn(['data', 'external_url'])}, '[link]')
              : ''
          );
        }
      });

      CMS.registerPreviewTemplate('cities', CityPreview);
      CMS.registerPreviewTemplate('datasets', DatasetPreview);
      CMS.registerWidget('submitter_email', SubmitterEmailControl);
    </script>
  </body>

</html>
